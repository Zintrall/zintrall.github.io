<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Utesni Ho — Aktivní servery</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <h1>Utesni Ho — Aktivní servery</h1>
                <p class="subtitle">
                    Seznam aktuálně dostupných serverů pro hru Utesni Ho.
                </p>
                <div class="header-actions">
                    <a class="button primary" href="add.html">Přidat server</a>
                    <a class="button ghost" href="guide.html">Nápověda</a>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="panel">
                <div class="filters">
                    <div class="field">
                        <label for="search">Hledat (název/IP)</label>
                        <input
                            id="search"
                            type="text"
                            placeholder="např. Praha, 123.45.67.89"
                        />
                    </div>
                    <div class="field">
                        <label for="minPlayers">Min. hráčů</label>
                        <input
                            id="minPlayers"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="0"
                        />
                    </div>
                    <div class="field">
                        <label for="maxPlayers">Max. hráčů</label>
                        <input
                            id="maxPlayers"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="bez limitu"
                        />
                    </div>
                    <div class="field">
                        <label for="sortBy">Řazení</label>
                        <select id="sortBy">
                            <option value="players-desc">
                                Hráči (nejvíce)
                            </option>
                            <option value="players-asc">Hráči (nejméně)</option>
                            <option value="name-asc">Název (A–Z)</option>
                            <option value="newest">Nejnovější</option>
                        </select>
                    </div>
                </div>
                <div class="summary">
                    <span id="serverCount">Načítání…</span>
                    <div class="notification-toggle">
                        <label>
                            <input id="notificationToggle" type="checkbox" />
                            <span>Zvuková upozornění</span>
                        </label>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Název</th>
                                <th>IP adresa</th>
                                <th>Hráči</th>
                                <th>Přidáno</th>
                            </tr>
                        </thead>
                        <tbody id="serversBody">
                            <tr>
                                <td colspan="4" class="muted">
                                    Načítání seznamu…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p id="emptyState" class="muted hidden">
                    Zatím nejsou žádné aktivní servery.
                </p>
            </section>
        </main>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
